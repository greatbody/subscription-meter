name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (for example, 1.0.0)'
        required: true
        type: string
      notes:
        description: 'Release notes'
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    name: Build and publish release
    runs-on: macos-15-intel
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Validate version
        env:
          VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          [[ "$VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]] || { echo 'Expected a version like 1.0.0'; exit 1; }
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/v$VERSION" >/dev/null 2>&1; then
            echo "Tag v$VERSION already exists"; exit 1
          fi

      - name: Run tests
        run: |
          Tests/run-settings-tests.sh
          Tests/run-adapter-tests.sh
          Tests/run-balance-ui-tests.sh
          node Tests/silicon-dom-tests.js

      - name: Build universal app
        env:
          VERSION: ${{ inputs.version }}
        run: |
          scripts/build-app.sh
          app='build/Subscription Meter.app'
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString $VERSION" "$app/Contents/Info.plist"
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $VERSION" "$app/Contents/Info.plist"
          codesign --force --sign - "$app"
          lipo "$app/Contents/MacOS/SubscriptionMeter" -verify_arch arm64 x86_64
          codesign --verify --deep --strict "$app"

      - name: Package and checksum
        run: |
          mkdir -p dist
          ditto -c -k --sequesterRsrc --keepParent 'build/Subscription Meter.app' 'dist/Subscription-Meter-macOS-universal.zip'
          cd dist
          shasum -a 256 Subscription-Meter-macOS-universal.zip > SHA256SUMS.txt
          shasum -a 256 -c SHA256SUMS.txt

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
          NOTES: ${{ inputs.notes }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          printf '%s\n\n%s\n' "$NOTES" 'Universal macOS app for Intel and Apple Silicon (macOS 13+). Ad-hoc signed and not notarized; macOS may require approval in System Settings. Verify the ZIP using SHA256SUMS.txt.' > dist/release-notes.md
          gh release create "v$VERSION" dist/Subscription-Meter-macOS-universal.zip dist/SHA256SUMS.txt \
            --target "$COMMIT_SHA" --title "Subscription Meter v$VERSION" --notes-file dist/release-notes.md --latest
