name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Build and publish release
    runs-on: macos-15-intel
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Validate version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          [[ "$TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]] || { echo 'Expected a tag like v1.0.0'; exit 1; }

      - name: Run tests
        run: |
          Tests/run-settings-tests.sh
          Tests/run-adapter-tests.sh
          Tests/run-balance-ui-tests.sh
          node Tests/silicon-dom-tests.js

      - name: Build universal app
        env:
          TAG: ${{ github.ref_name }}
        run: |
          scripts/build-app.sh
          app='build/Subscription Meter.app'
          VERSION="${TAG#v}"
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString $VERSION" "$app/Contents/Info.plist"
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $VERSION" "$app/Contents/Info.plist"
          codesign --force --sign - "$app"
          lipo "$app/Contents/MacOS/SubscriptionMeter" -verify_arch arm64 x86_64
          codesign --verify --deep --strict "$app"

      - name: Package and checksum
        run: |
          mkdir -p dist
          ditto -c -k --sequesterRsrc --keepParent 'build/Subscription Meter.app' 'dist/Subscription-Meter-macOS-universal.zip'
          cd dist
          shasum -a 256 Subscription-Meter-macOS-universal.zip > SHA256SUMS.txt
          shasum -a 256 -c SHA256SUMS.txt

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          previous=$(git describe --tags --abbrev=0 --match 'v[0-9]*' "$TAG^" 2>/dev/null || true)
          if [[ -n "$previous" ]]; then
            range="$previous..$TAG"
            printf '## Changes since %s\n\n' "$previous" > dist/release-notes.md
          else
            range="$TAG"
            printf '## Changes in the first release\n\n' > dist/release-notes.md
          fi
          git log "$range" --no-merges --format='- %s' >> dist/release-notes.md
          printf '\n\nUniversal macOS app for Intel and Apple Silicon (macOS 13+). Ad-hoc signed and not notarized; macOS may require approval in System Settings. Verify the ZIP using SHA256SUMS.txt.\n' >> dist/release-notes.md
          gh release create "$TAG" dist/Subscription-Meter-macOS-universal.zip dist/SHA256SUMS.txt \
            --verify-tag --title "Subscription Meter $TAG" --notes-file dist/release-notes.md --latest
